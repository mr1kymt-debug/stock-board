name: update-stock-screener

on:
  push:
    paths:
      - "my_stocks.txt"      # 自分の銘柄を書き換えて保存したら、すぐ動く
      - "news_view.json"     # ニュースを入れ替えたら、すぐ動く
      - "stock_board.html"   # ページの見た目を入れ替えたら、すぐ動く
      - "stock_screener.py"  # 分析のしかたを入れ替えたら、すぐ動く
      - "build_page.py"
  schedule:
    # 平日の22:15 UTC（日本時間の朝7:15）。米国株は前日の終値、日本株は当日の終値が反映済み
    - cron: "15 22 * * 1-5"
  workflow_dispatch:   # Actionsタブから手動でも実行できる

permissions:
  contents: write

concurrency:
  group: stock-screener      # 同じ設定が重なって動かないようにする

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 順番待ちのあとでも、いちばん新しい状態から始める

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: スコアを計算
        run: python stock_screener.py

      - name: ページを作成（取得失敗が多いときはここで止まり、公開中のページは更新されない）
        run: python build_page.py

      - name: 変更を保存（更新が重なって食い違っても、新しい結果を優先してやり直す）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener_result.csv docs/index.html
          git diff --cached --quiet || git commit -m "update stock screener $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
